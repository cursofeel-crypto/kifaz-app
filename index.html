<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KIFAZ - Quem faz, está aqui.</title>
    
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1J_q4ds9WTBV2UtCNrwYZsUyx6aJJUvq8&sz=w500">
    <link rel="apple-touch-icon" href="https://drive.google.com/thumbnail?id=1J_q4ds9WTBV2UtCNrwYZsUyx6aJJUvq8&sz=w500">
    <link rel="manifest" href="manifest.json">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- ========================================== -->
    <!-- ESTILOS (CSS)                              -->
    <!-- ========================================== -->
    <style>
        :root { --bg-dark: #121212; --bg-panel: #1e1e1e; --neon-yellow: #FFC107; --neon-green: #39FF14; --neon-red: #FF3B30; --text-main: #FFFFFF; --text-muted: #666666; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; }

        .screen { display: none; padding: 20px; min-height: 100vh; flex-direction: column; }
        .screen.active { display: flex; }

        /* Logo */
        .logo-container { text-align: center; margin-top: 5vh; margin-bottom: 30px; }
        .logo-container img { width: 140px; height: 140px; border-radius: 50%; box-shadow: 0 0 25px rgba(255, 193, 7, 0.3); object-fit: contain; background: #fff; }
        .logo-text { font-size: 2.5rem; font-weight: 800; letter-spacing: 2px; margin-top: 15px; }
        .neon-dot { color: var(--neon-yellow); text-shadow: 0 0 10px var(--neon-yellow); }

        /* Caixas e Inputs */
        .glass { background: rgba(30, 30, 30, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 20px; }
        input[type="text"], input[type="password"], input[type="email"], select, textarea { width: 100%; padding: 15px; margin-bottom: 15px; background: rgba(0, 0, 0, 0.5); border: 1px solid #333; color: var(--text-main); border-radius: 8px; outline: none; font-size: 16px; }
        input:focus, select:focus, textarea:focus { border-color: var(--neon-yellow); box-shadow: 0 0 8px rgba(255, 193, 7, 0.2); }
        .row-inputs { display: flex; gap: 10px; }

        /* Botões Base */
        button { border: none; cursor: pointer; font-weight: bold; border-radius: 8px; transition: 0.3s; font-size: 15px; letter-spacing: 1px; }
        
        /* BOTÕES NÉON (FUNDO TRANSPARENTE OBRIGATÓRIO) */
        .btn-neon-outline { 
            background: transparent !important; 
            color: var(--neon-yellow) !important; 
            border: 2px solid var(--neon-yellow) !important; 
            padding: 15px; 
            text-transform: uppercase; 
            box-shadow: 0 0 15px rgba(255, 193, 7, 0.3), inset 0 0 10px rgba(255, 193, 7, 0.1) !important; 
            width: 100%; 
        }
        .btn-neon-outline:hover { background: rgba(255, 193, 7, 0.1) !important; box-shadow: 0 0 25px rgba(255, 193, 7, 0.6), inset 0 0 15px rgba(255, 193, 7, 0.3) !important; }

        .btn-neon-outline.online { 
            color: var(--neon-green) !important; 
            border-color: var(--neon-green) !important; 
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.3), inset 0 0 10px rgba(57, 255, 20, 0.1) !important; 
        }
        .btn-neon-outline.online:hover { background: rgba(57, 255, 20, 0.1) !important; box-shadow: 0 0 25px rgba(57, 255, 20, 0.6), inset 0 0 15px rgba(57, 255, 20, 0.3) !important; }

        /* Links e Ícones Menores */
        .btn-link { background: none; color: #aaa; text-decoration: underline; padding: 15px; width: 100%; margin-top: 10px; font-weight: normal; }
        .btn-link:hover { color: var(--neon-yellow); }
        .btn-small { padding: 8px 15px; font-size: 12px; border: none; border-radius: 5px; color: #000; font-weight: bold; }
        .btn-bg-green { background: var(--neon-green); }
        .btn-bg-red { background: transparent; border: 1px solid var(--neon-red); color: var(--neon-red); }

        /* HEADER E MENU HAMBÚRGUER NATIVO */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; width: 100%; border-bottom: 1px solid #222; padding-bottom: 15px; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .btn-menu { background: transparent !important; border: none !important; color: #fff; font-size: 32px; cursor: pointer; padding: 0 5px; line-height: 1; }
        .btn-menu:hover { color: var(--neon-yellow); text-shadow: 0 0 10px var(--neon-yellow); }
        .btn-logout { background: transparent; border: none; color: #666; font-size: 24px; cursor: pointer; }
        .btn-logout:hover { color: var(--neon-red); }

        /* Menu Lateral (Sidebar) */
        .sidebar { position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background: #151515; z-index: 1000; transition: left 0.3s ease; padding: 30px 20px; border-right: 1px solid rgba(255,193,7,0.2); box-shadow: 5px 0 20px rgba(0,0,0,0.8); }
        .sidebar.active { left: 0; }
        .sidebar-header { font-size: 2rem; font-weight: 800; margin-bottom: 40px; color: #fff; text-align: center; }
        .menu-item { padding: 15px; font-size: 1.1rem; border-bottom: 1px solid #222; color: #ddd; cursor: pointer; display: flex; align-items: center; gap: 15px; transition: 0.2s; }
        .menu-item:hover { color: var(--neon-yellow); background: rgba(255,193,7,0.05); border-radius: 8px; border-bottom: 1px solid transparent; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; backdrop-filter: blur(4px); }
        .overlay.active { display: block; }

        /* Modais */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); align-items: center; justify-content: center; overflow-y: auto; padding: 20px 0; }
        .modal.active { display: flex; }
        .modal-content { width: 90%; max-width: 450px; position: relative; margin: auto; }
        .close { color: #aaa; float: right; font-size: 28px; cursor: pointer; position: absolute; right: 20px; top: 15px; z-index: 10; }

        /* Utilitários Admin e Cards */
        .badge { background: var(--neon-yellow); color: #000; padding: 2px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
        .user-card { border-left: 3px solid #333; background: rgba(0,0,0,0.4); padding: 15px; margin-bottom: 15px; border-radius: 0 8px 8px 0; border-top: 1px solid #222; border-right: 1px solid #222; border-bottom: 1px solid #222; }
        .user-card.pendente { border-left-color: var(--neon-yellow); }
        .user-card.ativo { border-left-color: var(--neon-green); }
        .user-card.rejeitado { border-left-color: var(--neon-red); }
        
        .tab-menu { display: flex; gap: 10px; margin-bottom: 25px; }
        .tab-btn { flex: 1; background: #222; color: #aaa; padding: 12px; text-align: center; border-radius: 8px; font-size: 14px; transition: 0.3s; border: none; }
        .tab-btn.active { background: rgba(255,193,7,0.1); color: var(--neon-yellow); box-shadow: inset 0 0 10px rgba(255,193,7,0.2); border: 1px solid var(--neon-yellow); }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- MENU LATERAL (SIDEBAR DINÂMICA)            -->
    <!-- ========================================== -->
    <div id="overlay" class="overlay" onclick="fecharMenu()"></div>
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">KIFAZ<span class="neon-dot">.</span></div>
        <div id="sidebar-menu-items"></div>
    </div>

    <!-- ========================================== -->
    <!-- TELA DE LOGIN                              -->
    <!-- ========================================== -->
    <div id="login-screen" class="screen active">
        <div class="logo-container">
            <img src="https://drive.google.com/thumbnail?id=1J_q4ds9WTBV2UtCNrwYZsUyx6aJJUvq8&sz=w500" alt="Logo KIFAZ">
            <div class="logo-text">KIFAZ<span class="neon-dot">.</span></div>
            <p style="color: #888; margin-top: 5px;">Quem faz, está aqui.</p>
        </div>
        
        <div class="login-box glass">
            <select id="login-tipo">
                <option value="Cliente">Entrar como Cliente</option>
                <option value="Profissional">Entrar como Profissional</option>
                <option value="Administrador">Acesso Restrito (Admin)</option>
            </select>
            <input type="email" id="login-email" placeholder="Seu Email" style="display: block;">
            <input type="password" id="login-senha" placeholder="Sua Senha">
            <button onclick="fazerLogin()" class="btn-neon-outline" id="btn-entrar">Entrar</button>
            <button onclick="abrirModalRegisto()" class="btn-link" id="btn-abrir-registo">Ainda não tem conta? Criar Conta</button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL DE CRIAR CONTA (REGISTO)             -->
    <!-- ========================================== -->
    <div id="modal-registo" class="modal">
        <div class="modal-content glass">
            <span class="close" onclick="fecharModalRegisto()">&times;</span>
            <h2 style="color: var(--neon-yellow); margin-bottom: 20px;">Criar Conta</h2>
            <label style="color: #aaa; font-size: 0.9em;">Quero me cadastrar como:</label>
            <select id="reg-tipo" onchange="toggleRegistoFields()">
                <option value="Cliente">Cliente</option>
                <option value="Profissional">Profissional</option>
            </select>
            <div class="row-inputs">
                <input type="text" id="reg-nome" placeholder="Nome">
                <input type="text" id="reg-sobrenome" placeholder="Último Nome">
            </div>
            <input type="email" id="reg-email" placeholder="Email">
            <div id="reg-prof-container" style="display: none;">
                <select id="reg-profissao">
                    <option value="" disabled selected>Sua Profissão</option>
                    <option value="Pladur">Pladur</option><option value="Eletricista">Eletricista</option><option value="Pintor">Pintor</option><option value="Canalizador">Canalizador</option><option value="Barrador">Barrador</option>
                </select>
            </div>
            <input type="password" id="reg-senha" placeholder="Senha">
            <input type="password" id="reg-senha-conf" placeholder="Confirmar Senha">
            <button onclick="enviarRegisto()" id="btn-submit-reg" class="btn-neon-outline" style="margin-top: 10px;">CRIAR</button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- TELA DE ADMINISTRADOR                      -->
    <!-- ========================================== -->
    <div id="admin-screen" class="screen">
        <header>
            <div class="header-left">
                <button onclick="abrirMenu()" class="btn-menu">☰</button>
                <h2 style="margin: 0;">Painel Admin <span style="color:var(--neon-yellow);">•</span></h2>
            </div>
            <button onclick="logout()" class="btn-logout" title="Sair"><i class="fas fa-sign-out-alt"></i></button>
        </header>
        <div class="glass">
            <div class="tab-menu">
                <button class="tab-btn active" id="tab-pendentes" onclick="mudarAbaAdmin('pendentes')">Pendentes</button>
                <button class="tab-btn" id="tab-todos" onclick="mudarAbaAdmin('todos')">Todos Usuários</button>
            </div>
            <div id="admin-view-pendentes"><div id="lista-pendentes">Carregando...</div></div>
            <div id="admin-view-todos" style="display: none;"><div id="lista-todos-usuarios">Carregando...</div></div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- TELA DO CLIENTE                            -->
    <!-- ========================================== -->
    <div id="cliente-screen" class="screen">
        <header>
            <div class="header-left">
                <button onclick="abrirMenu()" class="btn-menu">☰</button>
                <h2 style="margin: 0;">Olá, <span id="nome-cliente-display"></span></h2>
            </div>
            <button onclick="logout()" class="btn-logout"><i class="fas fa-sign-out-alt"></i></button>
        </header>
        <button onclick="document.getElementById('modal-pedido').classList.add('active');" class="btn-neon-outline" style="padding: 20px; font-size: 1.2rem; margin-bottom: 25px;">
            <i class="fas fa-bolt" style="margin-right: 10px;"></i> Solicitar Serviço
        </button>
        <div>
            <h3 style="color: var(--neon-yellow); margin-bottom: 15px;"><i class="fas fa-list-alt"></i> Meus Pedidos</h3>
            <div id="lista-pedidos-cliente" class="glass">Nenhum pedido ativo no momento.</div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- TELA DO PROFISSIONAL                       -->
    <!-- ========================================== -->
    <div id="pro-screen" class="screen">
        <header>
            <div class="header-left">
                <button onclick="abrirMenu()" class="btn-menu">☰</button>
                <h2 style="margin: 0;">Modo Pro <span id="dot-status-pro" style="color:#666; text-shadow:none; transition:0.3s;">•</span></h2>
            </div>
            <button onclick="logout()" class="btn-logout"><i class="fas fa-sign-out-alt"></i></button>
        </header>
        
        <div style="margin-bottom: 30px;">
            <!-- BOTÃO NÉON TRANSPARENTE -->
            <button id="btn-status" onclick="toggleStatus()" class="btn-neon-outline">
                FICAR ONLINE PARA RECEBER PEDIDOS
            </button>
        </div>
        
        <div class="glass">
            <h3 style="color: var(--neon-yellow); margin-bottom: 15px;">
                <i class="fas fa-map-marker-alt"></i> Pedidos Próximos <span id="alerta-pedidos" class="badge">0</span>
            </h3>
            <div id="lista-pedidos-pro" style="color: #aaa;">
                Fique online para ver clientes a procurar os seus serviços na região.
            </div>
        </div>
    </div>

    <!-- MODAL DE PEDIDO (CLIENTE) -->
    <div id="modal-pedido" class="modal">
        <div class="modal-content glass">
            <span class="close" onclick="document.getElementById('modal-pedido').classList.remove('active');">&times;</span>
            <h3 style="margin-bottom:20px; color: var(--neon-yellow); text-align:center;">O que você precisa?</h3>
            <select id="categoria-pedido">
                <option value="Pladur">Pladur</option><option value="Eletricista">Eletricista</option><option value="Pintor">Pintor</option><option value="Canalizador">Canalizador</option><option value="Barrador">Barrador</option>
            </select>
            <textarea id="desc-pedido" placeholder="Descreva o serviço com o máximo de detalhes..." rows="5"></textarea>
            <button onclick="enviarPedido()" class="btn-neon-outline" style="margin-top: 10px;">PEDIR ORÇAMENTOS AGORA</button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT (LÓGICA E CONEXÃO)              -->
    <!-- ========================================== -->
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwECa674WOxJLt_vT8vR7SlRsup45jMBAxVl8PLMn1oLAxwxD9tm8gYng8ZTpfTKfYH/exec'; 
        let usuarioAtual = null;
        let coordsAtuais = { lat: 0, lng: 0 };
        let proIsOnline = false;

        // MENU LATERAL
        function abrirMenu() { document.getElementById('sidebar').classList.add('active'); document.getElementById('overlay').classList.add('active'); }
        function fecharMenu() { document.getElementById('sidebar').classList.remove('active'); document.getElementById('overlay').classList.remove('active'); }

        function construirMenu(tipo) {
            const menu = document.getElementById('sidebar-menu-items');
            if (tipo === 'Administrador') {
                menu.innerHTML = `
                    <div class="menu-item" onclick="fecharMenu(); mudarAbaAdmin('pendentes')">⏳ Solicitações</div>
                    <div class="menu-item" onclick="fecharMenu(); mudarAbaAdmin('todos')">👥 Utilizadores</div>
                    <div class="menu-item" onclick="logout()" style="color:var(--neon-red); margin-top:20px; border-top:1px solid #333;">❌ Sair</div>`;
            } else if (tipo === 'Cliente') {
                menu.innerHTML = `
                    <div class="menu-item" onclick="fecharMenu()">🏠 Início</div>
                    <div class="menu-item" onclick="fecharMenu(); document.getElementById('modal-pedido').classList.add('active');">⚡ Novo Pedido</div>
                    <div class="menu-item" onclick="logout()" style="color:var(--neon-red); margin-top:20px; border-top:1px solid #333;">❌ Sair</div>`;
            } else if (tipo === 'Profissional') {
                menu.innerHTML = `
                    <div class="menu-item" onclick="fecharMenu()">💼 Painel de Obras</div>
                    <div class="menu-item" onclick="logout()" style="color:var(--neon-red); margin-top:20px; border-top:1px solid #333;">❌ Sair</div>`;
            }
        }

        // LOGIN E REGISTO
        document.getElementById('login-tipo').addEventListener('change', function() {
            const emailInput = document.getElementById('login-email'); const regBtn = document.getElementById('btn-abrir-registo');
            if (this.value === 'Administrador') { emailInput.style.display = 'none'; regBtn.style.display = 'none'; } else { emailInput.style.display = 'block'; regBtn.style.display = 'block'; }
        });

        function abrirModalRegisto() { document.getElementById('modal-registo').classList.add('active'); }
        function fecharModalRegisto() { document.getElementById('modal-registo').classList.remove('active'); }
        function toggleRegistoFields() {
            const tipo = document.getElementById('reg-tipo').value; const profField = document.getElementById('reg-prof-container');
            if (tipo === 'Profissional') { profField.style.display = 'block'; } else { profField.style.display = 'none'; }
        }

        async function enviarRegisto() {
            const payload = { tipo: document.getElementById('reg-tipo').value, nome: document.getElementById('reg-nome').value, sobrenome: document.getElementById('reg-sobrenome').value, email: document.getElementById('reg-email').value, senha: document.getElementById('reg-senha').value, senhaConf: document.getElementById('reg-senha-conf').value, profissao: document.getElementById('reg-profissao').value };
            if (!payload.nome || !payload.email || !payload.senha) return alert('Preencha os campos obrigatórios.');
            if (payload.senha !== payload.senhaConf) return alert('As senhas não coincidem.');
            if (payload.tipo === 'Profissional' && !payload.profissao) return alert('Selecione uma profissão.');

            const btn = document.getElementById('btn-submit-reg'); btn.innerText = 'A ENVIAR...';
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'registrar_conta', payload }) });
                const data = await res.json();
                if (data.sucesso) { alert(data.mensagem); fecharModalRegisto(); document.getElementById('login-email').value = payload.email; document.getElementById('login-senha').value = ''; } 
                else { alert(data.erro); }
            } catch(e) { alert("Erro de conexão."); }
            btn.innerText = 'CRIAR';
        }

        async function fazerLogin() {
            const payload = { tipo: document.getElementById('login-tipo').value, email: document.getElementById('login-email').value, senha: document.getElementById('login-senha').value };
            if (!payload.senha) return alert('Insira a senha.');
            const btn = document.getElementById('btn-entrar'); btn.innerText = 'VALIDANDO...';
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', payload }) });
                const data = await res.json();
                if (data.sucesso) {
                    construirMenu(data.tipo); 
                    if (data.tipo === 'Administrador') { navegarParaTela('admin-screen'); carregarPendentesAdmin(); } 
                    else {
                        usuarioAtual = data;
                        if(navigator.geolocation) { navigator.geolocation.getCurrentPosition(p => {coordsAtuais.lat=p.coords.latitude; coordsAtuais.lng=p.coords.longitude;}); }
                        if (data.tipo === 'Cliente') { document.getElementById('nome-cliente-display').innerText = data.nome; navegarParaTela('cliente-screen'); } else { navegarParaTela('pro-screen'); }
                    }
                } else { alert(data.erro); }
            } catch(e) { alert("Erro de conexão."); }
            btn.innerText = 'ENTRAR';
        }

        // ADMIN E UTILITÁRIOS
        function mudarAbaAdmin(aba) {
            document.getElementById('tab-pendentes').classList.remove('active'); document.getElementById('tab-todos').classList.remove('active');
            document.getElementById('admin-view-pendentes').style.display = 'none'; document.getElementById('admin-view-todos').style.display = 'none';
            if(aba === 'pendentes') { document.getElementById('tab-pendentes').classList.add('active'); document.getElementById('admin-view-pendentes').style.display = 'block'; carregarPendentesAdmin(); } 
            else { document.getElementById('tab-todos').classList.add('active'); document.getElementById('admin-view-todos').style.display = 'block'; carregarTodosUsuariosAdmin(); }
        }

        async function carregarPendentesAdmin() {
            const container = document.getElementById('lista-pendentes'); container.innerHTML = 'Buscando solicitações...';
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'admin_listar_pendentes' }) });
            const data = await res.json();
            if (data.pendentes && data.pendentes.length > 0) {
                container.innerHTML = data.pendentes.map(p => `<div class="user-card pendente"><strong style="color:#fff;">${p.nomeCompleto}</strong> <span class="badge">${p.profissao}</span><br><span style="font-size:0.85em; color:var(--text-muted);">${p.email}</span><div style="margin-top: 15px; display:flex; gap:10px;"><button onclick="aprovarPro('${p.id}')" class="btn-small btn-bg-green">Aprovar</button><button onclick="rejeitarPro('${p.id}')" class="btn-small btn-bg-red">Rejeitar</button></div></div>`).join('');
            } else { container.innerHTML = '<div class="glass">Nenhuma solicitação pendente.</div>'; }
        }
        async function carregarTodosUsuariosAdmin() {
            const container = document.getElementById('lista-todos-usuarios'); container.innerHTML = 'Carregando lista de utilizadores...';
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'admin_listar_usuarios' }) });
            const data = await res.json();
            if (data.usuarios && data.usuarios.length > 0) {
                container.innerHTML = data.usuarios.map(u => {
                    let classeStatus = u.status === 'Ativo' ? 'ativo' : (u.status === 'Rejeitado' ? 'rejeitado' : 'pendente');
                    let prof = u.tipo === 'Profissional' ? `<span class="badge">${u.profissao}</span>` : `<span class="badge" style="background:#444; color:#fff;">Cliente</span>`;
                    return `<div class="user-card ${classeStatus}"><strong style="color:#fff;">${u.nomeCompleto}</strong> ${prof}<br><span style="font-size:0.85em; color:var(--text-muted);">${u.email}</span><br><span style="font-size:0.75em; text-transform:uppercase; font-weight:bold; color:var(--text-muted); display:inline-block; margin-top:5px;">STATUS: ${u.status}</span></div>`;
                }).join('');
            } else { container.innerHTML = '<div class="glass">Base de dados vazia.</div>'; }
        }
        async function aprovarPro(id) { await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'admin_aprovar_pro', payload: { id } }) }); carregarPendentesAdmin(); }
        async function rejeitarPro(id) { if(confirm("Deseja rejeitar este profissional?")) { await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'admin_rejeitar_pro', payload: { id } }) }); carregarPendentesAdmin(); } }

        function navegarParaTela(idTela) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(idTela).classList.add('active'); fecharMenu(); }
        function logout() { usuarioAtual = null; document.getElementById('login-senha').value = ''; if(window.proSearchInterval) clearInterval(window.proSearchInterval); navegarParaTela('login-screen'); }

        async function enviarPedido() {
            document.getElementById('modal-pedido').classList.remove('active');
            const cat = document.getElementById('categoria-pedido').value; const desc = document.getElementById('desc-pedido').value;
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'criar_pedido', payload: { idCliente: usuarioAtual.id, categoria: cat, descricao: desc, lat: coordsAtuais.lat, lng: coordsAtuais.lng } }) });
            document.getElementById('lista-pedidos-cliente').innerHTML = `<div class="glass" style="border-left: 3px solid var(--neon-yellow);"><strong style="color:var(--neon-yellow);">${cat}</strong><br><span style="font-size:0.9em; color:#ccc;">${desc}</span><br><br><span style="font-size:0.8em; color:var(--neon-green);">Buscando profissionais próximos...</span></div>`;
        }

        // LÓGICA DO STATUS NÉON (FUNDO TRANSPARENTE E PONTO)
        function toggleStatus() {
            proIsOnline = !proIsOnline; 
            const btn = document.getElementById('btn-status');
            const dot = document.getElementById('dot-status-pro');

            if (proIsOnline) { 
                btn.innerHTML = 'BUSCANDO PEDIDOS...'; 
                btn.classList.add('online'); // Muda o glow para verde
                
                // Liga o Ponto
                dot.style.color = 'var(--neon-green)';
                dot.style.textShadow = '0 0 10px var(--neon-green)';

                window.proSearchInterval = setInterval(buscarPedidos, 5000); buscarPedidos(); 
            } else { 
                btn.innerHTML = 'FICAR ONLINE PARA RECEBER PEDIDOS'; 
                btn.classList.remove('online'); // Volta o glow para amarelo
                
                // Desliga o Ponto
                dot.style.color = '#666';
                dot.style.textShadow = 'none';

                clearInterval(window.proSearchInterval); 
            }
        }

        async function buscarPedidos() {
            if(!proIsOnline) return;
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'buscar_pedidos_pro', payload: { latPro: coordsAtuais.lat, lngPro: coordsAtuais.lng, raioPro: 15, profissao: usuarioAtual.profissao } }) });
            const data = await res.json();
            if (data.pedidos && data.pedidos.length > 0) {
                document.getElementById('alerta-pedidos').innerText = data.pedidos.length;
                document.getElementById('lista-pedidos-pro').innerHTML = data.pedidos.map(p => `<div class="glass" style="margin-bottom:15px; border:1px solid #333;"><strong style="color:var(--neon-yellow);">Cliente a ${p.distancia_km}km!</strong><br><span style="display:block; margin: 10px 0; color:#ddd;">${p.descricao}</span><button class="btn-neon-outline" style="padding:10px; font-size:12px;">Enviar Orçamento</button></div>`).join('');
            }
        }
    </script>
</body>
</html>
